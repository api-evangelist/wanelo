name: wanelo
description: >-
  wanelo ("The intelligent everything store") is an AI-powered shopping storefront
  offering natural-language and visual product discovery, personalized
  recommendations, and a buy-for-me assistant, built on Shopify. It exposes an
  agent-commerce surface via the Universal Commerce Protocol (UCP, ucp.dev) with a
  hosted MCP endpoint for catalog search, cart, and buyer-approved checkout, plus
  Shopify Customer Account OAuth/OpenID Connect and a published /llms.txt (mirroring
  /agents.md). Originally a social-shopping product backed by Slow Ventures,
  wanelo.com now operates as an agent-ready commerce store. Read-only catalog
  browsing (products/collections/search JSON) requires no authentication.
